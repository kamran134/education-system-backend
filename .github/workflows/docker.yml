name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - main

# Не даём двум прогонам ЭТОГО репозитория деплоить одновременно (быстрый повторный push).
# Межрепозиторную гонку с фронтендом это НЕ решает: concurrency-группы в GitHub Actions
# ограничены одним репозиторием и не разделяются между ними. Для этого — flock на сервере,
# см. шаг деплоя ниже.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/kamran134/education-system-backend:latest .
          docker push ghcr.io/kamran134/education-system-backend:latest

      - name: Install SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key

      - name: Write .env to server
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          PG_URL: ${{ secrets.PG_URL }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          echo "MONGO_URI=${MONGO_URI}" > backend.env
          echo "JWT_SECRET=${JWT_SECRET}" >> backend.env
          echo "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}" >> backend.env
          echo "NODE_ENV=production" >> backend.env
          echo "PORT=5000" >> backend.env
          echo "PG_URL=${PG_URL}" >> backend.env
          echo "PG_PASSWORD=${PG_PASSWORD}" >> backend.env
          scp -i deploy_key -o StrictHostKeyChecking=no backend.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/isim/.env
          rm -f backend.env

      - name: Copy DB migration files to server
        run: |
          scp -i deploy_key -o StrictHostKeyChecking=no -r db ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/isim/

      - name: Run pending DB migrations
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash ~/isim/db/migrations/apply-pending.sh"

      # flock сериализует деплой с фронтендовым воркфлоу: оба гоняют `docker compose` над одним
      # проектом ~/isim, а параллельные вызовы compose над одним проектом не безопасны. 19.08.2026
      # именно это и произошло — пуш обоих репозиториев подряд, деплои наложились, и бэкендовый
      # упал с "removal of container ... is already in progress" (контейнер при этом успел
      # подняться на новом коде, свалилась только уборка старого, но воркфлоу вышел с кодом 1).
      # -w 600: ждать освобождения замка до 10 минут, а не падать сразу.
      # --force-recreate: у compose после того сбоя остался контейнер с временным именем
      # <hash>_backend-app, и обычный `up -d` считал его актуальным и ничего не пересоздавал.
      - name: Deploy backend on server
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "flock -w 600 /tmp/isim-deploy.lock -c 'cd ~/isim && docker compose pull backend && docker compose up -d --force-recreate backend'"